<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bracket Battle — 2026 NCAA Men's Lacrosse</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --navy:#0d1f3c;--navy2:#162847;--navy3:#1e3560;
  --blue:#2563a8;--blue2:#4a90d9;--blue-l:#dbeafe;
  --white:#fff;--off:#f0f4f8;--gray:#dde3ea;--gray2:#b0bac6;
  --text:#111827;--muted:#64748b;--green:#15803d;--green-l:#dcfce7;
  --red:#b91c1c;--red-l:#fee2e2;--gold:#d97706;--gold-l:#fef3c7;
  --amber:#f59e0b;--amber-l:#fffbeb;
  --r:4px;--rl:8px;
  --fh:'Oswald',sans-serif;--fb:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);color:var(--text);font-size:13px;min-height:100vh;background:var(--off)}

/* ── AUTH ── */
.auth-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:var(--navy);position:relative;overflow:hidden}
.auth-bg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);gap:2px;opacity:.18}
.auth-bg img{width:100%;height:100%;object-fit:cover;filter:saturate(.6)}
.auth-bg-overlay{position:absolute;inset:0;background:linear-gradient(155deg,rgba(13,31,60,.97) 0%,rgba(13,31,60,.85) 100%)}
.auth-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%}
.auth-eyebrow{font-family:var(--fh);font-size:11px;letter-spacing:.22em;color:var(--blue2);text-transform:uppercase;margin-bottom:10px}
.auth-wordmark{font-family:var(--fh);font-size:60px;font-weight:700;color:var(--white);text-transform:uppercase;letter-spacing:.01em;line-height:.9;text-shadow:0 4px 24px rgba(0,0,0,.5);text-align:center}
.auth-wordmark span{color:var(--blue2)}
.auth-tag{font-size:11px;color:rgba(255,255,255,.45);letter-spacing:.1em;text-transform:uppercase;margin-top:14px;text-align:center}
.auth-rule{width:56px;height:3px;background:linear-gradient(90deg,var(--blue2),var(--blue));margin:18px auto 28px;border-radius:2px}
.auth-card{background:rgba(255,255,255,.98);border-radius:var(--rl);width:100%;max-width:400px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.6)}
.auth-card-hdr{background:var(--navy);padding:14px 22px;border-bottom:3px solid var(--blue2)}
.auth-card-title{font-family:var(--fh);font-size:16px;font-weight:600;color:var(--white);text-transform:uppercase;letter-spacing:.08em}
.auth-tabs{display:flex;background:var(--navy2)}
.auth-tab{flex:1;padding:11px;text-align:center;font-family:var(--fh);font-size:12px;font-weight:500;cursor:pointer;color:rgba(255,255,255,.38);border-bottom:3px solid transparent;transition:all .15s;text-transform:uppercase;letter-spacing:.08em}
.auth-tab.active{color:var(--white);border-bottom-color:var(--blue2)}
.auth-body{padding:22px}
.fl{font-family:var(--fh);font-size:10px;font-weight:500;color:var(--navy);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em}
.fi{width:100%;padding:10px 13px;border:1.5px solid var(--gray);border-radius:var(--r);background:var(--white);color:var(--text);font-size:13px;font-family:var(--fb);outline:none;transition:border .15s;margin-bottom:14px;display:block}
.fi:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(74,144,217,.15)}
.btn-primary{width:100%;padding:13px;background:var(--blue);color:var(--white);border:none;border-radius:var(--r);font-family:var(--fh);font-size:14px;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:.1em;transition:background .15s}
.btn-primary:hover{background:var(--navy)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.form-err{font-size:11px;color:var(--red);margin-top:9px;min-height:16px;line-height:1.4}
.form-info{font-size:11px;color:var(--blue2);margin-top:6px;min-height:16px}

/* ── SHELL ── */
.shell{display:none;flex-direction:column;min-height:100vh}

/* ── HERO BANNER — pure CSS, no photos ── */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0a1628 0%,#0d1f3c 40%,#112244 70%,#0a1628 100%);border-bottom:3px solid var(--blue2)}
/* decorative geometric lines */
.hero::before{content:'';position:absolute;inset:0;background:
  repeating-linear-gradient(105deg,transparent,transparent 60px,rgba(74,144,217,.04) 60px,rgba(74,144,217,.04) 61px);
  pointer-events:none}
.hero::after{content:'';position:absolute;top:-40px;right:-40px;width:260px;height:260px;border-radius:50%;border:1px solid rgba(74,144,217,.12);pointer-events:none}
.hero-inner{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:22px 26px 20px}
.hero-brand{display:flex;flex-direction:column}
.hero-eyebrow{font-family:var(--fh);font-size:10px;letter-spacing:.28em;color:var(--blue2);text-transform:uppercase;margin-bottom:6px}
.hero-title{font-family:var(--fh);font-size:44px;font-weight:700;color:var(--white);text-transform:uppercase;letter-spacing:.03em;line-height:.9}
.hero-title span{color:var(--blue2)}
.hero-subtitle{font-family:var(--fh);font-size:11px;color:rgba(255,255,255,.38);text-transform:uppercase;letter-spacing:.14em;margin-top:8px}
.hero-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.hero-user{font-family:var(--fh);font-size:12px;color:var(--blue2);letter-spacing:.06em}
.hero-accent{font-family:var(--fh);font-size:9px;color:rgba(255,255,255,.22);letter-spacing:.12em;text-transform:uppercase}
.btn-so{padding:7px 18px;border:1.5px solid rgba(255,255,255,.25);border-radius:var(--r);background:transparent;color:rgba(255,255,255,.75);font-family:var(--fh);font-size:11px;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;transition:all .15s}
.btn-so:hover{border-color:var(--blue2);color:var(--white);background:rgba(74,144,217,.1)}
.hero-eyebrow{font-family:var(--fh);font-size:10px;letter-spacing:.28em;color:var(--blue2);text-transform:uppercase;margin-bottom:6px}
.hero-title{font-family:var(--fh);font-size:44px;font-weight:700;color:var(--white);text-transform:uppercase;letter-spacing:.03em;line-height:.9}
.hero-title span{color:var(--blue2)}
.btn-so{padding:6px 16px;border:1.5px solid rgba(255,255,255,.28);border-radius:var(--r);background:transparent;color:rgba(255,255,255,.75);font-family:var(--fh);font-size:11px;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;transition:all .15s}
.btn-so:hover{border-color:rgba(255,255,255,.6);color:var(--white)}

/* ── APP NAV ── */
.app-nav{background:var(--navy2);display:flex;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.app-nav-tab{padding:12px 18px;font-family:var(--fh);font-size:12px;font-weight:500;cursor:pointer;color:rgba(255,255,255,.4);border-bottom:3px solid transparent;transition:all .15s;text-transform:uppercase;letter-spacing:.08em;margin-bottom:-1px}
.app-nav-tab:hover{color:rgba(255,255,255,.8)}
.app-nav-tab.active{color:var(--white);border-bottom-color:var(--blue2)}
.main{padding:16px;flex:1;max-width:1100px;margin:0 auto;width:100%}

/* ── DEADLINE BANNER ── */
.deadline-banner{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--rl);margin-bottom:14px;font-size:12px}
.deadline-banner.live{background:var(--navy);border:1.5px solid var(--blue2);color:var(--white)}
.deadline-banner.expired{background:var(--red-l);border:1.5px solid var(--red);color:var(--red)}
.deadline-icon{font-size:20px;flex-shrink:0}
.deadline-text strong{display:block;font-family:var(--fh);font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.deadline-cd{font-family:'Courier New',monospace;font-size:14px;font-weight:700;color:var(--gold);margin-left:auto;white-space:nowrap;background:rgba(0,0,0,.25);padding:4px 10px;border-radius:4px}

/* ── ROUND TABS ── */
.round-tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.round-tab{display:flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--rl);font-family:var(--fh);font-size:12px;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;border:2px solid var(--gray);background:var(--white);color:var(--muted);transition:all .15s;user-select:none}
.round-tab.active{background:var(--navy);border-color:var(--navy);color:var(--white);box-shadow:0 4px 14px rgba(13,31,60,.25)}
.round-tab.unlocked:not(.active){background:var(--white);border-color:var(--blue2);color:var(--blue);cursor:pointer}
.round-tab.unlocked:not(.active):hover{background:var(--blue-l)}
.round-tab.locked{opacity:.45;cursor:not-allowed;pointer-events:none}
.round-tab .tab-badge{font-size:9px;background:var(--green-l);color:var(--green);border-radius:10px;padding:1px 6px;font-family:var(--fb);font-weight:600;letter-spacing:.02em}
.round-tab.active .tab-badge{background:rgba(255,255,255,.2);color:rgba(255,255,255,.8)}
.round-tab .tab-lock{font-size:11px;opacity:.6}
.round-progress{font-size:10px;color:var(--muted);margin-bottom:6px;font-family:var(--fh);letter-spacing:.04em;text-transform:uppercase}
.pick-help{background:var(--navy);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;border-left:4px solid var(--blue2)}
.pick-help-line{font-size:12px;color:var(--white);font-family:var(--fb);font-weight:500;line-height:1.7}

/* ── MATCHUP GRID ── */
.matchup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.matchup-grid.single{grid-template-columns:minmax(280px,480px);justify-content:center}
.matchup-grid.double{grid-template-columns:repeat(2,1fr)}

/* ── MATCHUP CARD ── */
.card{background:var(--white);border:1.5px solid var(--gray);border-radius:var(--rl);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.07);transition:border-color .15s,box-shadow .15s}
.card.has-pick{border-color:var(--blue2);border-width:2px;box-shadow:0 4px 20px rgba(74,144,217,.18)}
.card.needs-pick{border:1.5px dashed var(--amber)}
.card.unavailable{opacity:.5;pointer-events:none}

.card-header{background:var(--navy);padding:6px 12px;display:flex;justify-content:space-between;align-items:center}
.card-loc{font-size:8px;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.card-time{font-size:8px;color:var(--blue2);font-weight:600;font-family:var(--fh);letter-spacing:.04em;white-space:nowrap}

/* ── TEAM ROW ── */
.team-row{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;transition:background .12s,border-left-color .12s;border-left:4px solid transparent;position:relative;min-height:48px}
.team-row:first-of-type{border-bottom:1px solid var(--gray)}
.team-row.pickable:hover{background:rgba(74,144,217,.09)}
.team-row.pickable:hover .t-name{color:var(--blue)}
/* PICKED — ESPN-style: strong left border, subtle tint, bold name. No solid fill. */
.team-row.is-pick{border-left-color:var(--blue2);border-left-width:5px;background:rgba(74,144,217,.08);cursor:default}
.team-row.is-pick .t-name{color:var(--blue);font-weight:700}
.team-row.is-pick .t-seed{color:var(--blue2)}
.team-row.is-pick .t-rec{color:var(--muted)}
.team-row.is-pick:hover{background:rgba(74,144,217,.08)}
.team-row.is-winner .t-name{color:var(--green);font-weight:700}
.team-row.is-elim{opacity:.28;pointer-events:none}
.team-row.is-locked{cursor:default}
.team-row.is-empty{cursor:default;background:var(--amber-l)}
.team-row.is-empty-locked{cursor:default;background:var(--off)}

.t-seed{font-family:var(--fh);font-size:11px;font-weight:700;color:var(--muted);width:22px;flex-shrink:0;text-align:center}
.t-info{flex:1;min-width:0}
.t-name{font-family:var(--fh);font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;letter-spacing:.02em;color:inherit;transition:color .12s}
.t-rec{font-size:9px;color:var(--muted);margin-top:2px}
.t-adv{font-family:var(--fh);font-size:8px;background:var(--green-l);color:var(--green);border-radius:3px;padding:2px 6px;letter-spacing:.04em;flex-shrink:0}
.t-lock-icon{font-size:10px;opacity:.2;flex-shrink:0}

/* empty row */
.t-empty-icon{width:28px;height:28px;border-radius:4px;background:rgba(245,158,11,.15);border:1px dashed var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px}
.t-empty-label{font-family:var(--fh);font-size:11px;color:var(--amber);letter-spacing:.04em}
.t-empty-hint{font-size:9px;color:rgba(217,119,6,.6);margin-top:1px}

/* ✕ clear — ONLY clears this slot, no cascade */
.t-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:rgba(74,144,217,.15);border:1px solid rgba(74,144,217,.3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--blue);transition:all .15s;z-index:5;padding:0;line-height:1;font-weight:700}
.t-clear:hover{background:var(--red);border-color:var(--red);color:var(--white);transform:translateY(-50%) scale(1.1)}

/* odds */
.card-odds{padding:5px 12px 6px;background:rgba(240,244,248,.7);border-top:1px solid var(--gray)}
.odds-row{display:flex;justify-content:space-between;margin-bottom:3px}
.odds-lbl{font-size:8px;color:var(--muted);font-family:var(--fh);letter-spacing:.04em}
.odds-track{height:3px;border-radius:2px;background:var(--gray);overflow:hidden;display:flex}
.odds-a{height:100%;background:var(--blue2)}
.odds-b{height:100%;background:var(--gray2)}
.odds-src{font-size:7.5px;color:var(--muted);margin-top:2px;opacity:.75}

/* adv strip */
.card-adv{font-family:var(--fh);font-size:8px;color:rgba(74,144,217,.8);text-align:center;padding:4px;background:rgba(37,99,168,.05);border-top:1px solid rgba(37,99,168,.1);letter-spacing:.06em;text-transform:uppercase}

/* ── SAVE BAR ── */
.save-bar{margin-top:16px;padding:14px 16px;background:var(--white);border:1.5px solid var(--gray);border-radius:var(--rl);display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.btn-save{padding:10px 24px;background:var(--blue);color:var(--white);border:none;border-radius:var(--r);font-family:var(--fh);font-size:13px;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;transition:background .15s}
.btn-save:hover{background:var(--navy)}
.btn-save:disabled{opacity:.5;cursor:not-allowed}
.save-hint{font-size:11px;color:var(--muted)}
.save-msg{font-size:11px;font-weight:500}

.locked-banner{background:var(--navy);border:1.5px solid var(--blue2);border-radius:var(--r);padding:13px 16px;display:flex;align-items:center;gap:12px;margin-top:16px}
.locked-icon{font-size:22px}
.locked-text{font-size:12px;color:var(--white);line-height:1.5}
.locked-text strong{font-family:var(--fh);color:var(--blue2);font-size:14px;display:block;margin-bottom:2px;letter-spacing:.03em}
.closed-banner{background:var(--red-l);border:1.5px solid var(--red);border-radius:var(--r);padding:13px 16px;display:flex;align-items:center;gap:12px;margin-top:16px}
.closed-text{font-size:12px;color:var(--red);line-height:1.5}
.closed-text strong{font-family:var(--fh);font-size:14px;display:block;margin-bottom:2px}

/* legend */
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding:9px 12px;background:var(--white);border:1px solid var(--gray);border-radius:var(--r)}
.li{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);font-family:var(--fh);letter-spacing:.03em}
.ls{width:10px;height:10px;border-radius:2px}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.modal{background:var(--white);border-radius:var(--rl);padding:30px 26px;max-width:380px;width:100%;box-shadow:0 32px 80px rgba(0,0,0,.5)}
.modal-icon{font-size:36px;text-align:center;margin-bottom:14px}
.modal-title{font-family:var(--fh);font-size:20px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.06em;text-align:center;margin-bottom:10px}
.modal-body{font-size:12px;color:#4a5568;text-align:center;line-height:1.7;margin-bottom:22px}
.modal-body strong{color:var(--red)}
.modal-btns{display:flex;gap:10px}
.modal-cancel{flex:1;padding:11px;border:1.5px solid var(--gray2);border-radius:var(--r);background:transparent;color:var(--muted);font-family:var(--fh);font-size:12px;font-weight:500;cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
.modal-cancel:hover{background:var(--off)}
.modal-confirm{flex:1;padding:11px;border:none;border-radius:var(--r);background:var(--red);color:var(--white);font-family:var(--fh);font-size:12px;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
.modal-confirm:hover{background:#991b1b}

/* leaderboard */
.lb-wrap{border-radius:var(--rl);overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.lb-hdr{background:var(--navy);padding:11px 16px;border-bottom:2px solid var(--blue2);display:flex;align-items:center;justify-content:space-between}
.lb-title{font-family:var(--fh);font-size:20px;font-weight:700;color:var(--white);text-transform:uppercase;letter-spacing:.06em}
.lb-count{font-size:10px;color:var(--blue2);font-family:var(--fh)}
.lb-table{background:var(--white);border:1px solid var(--gray);border-top:none}
.lbrow{display:grid;grid-template-columns:36px 1fr 110px 65px 70px 65px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--gray);cursor:pointer;transition:background .12s}
.lbrow:last-child{border-bottom:none}
.lbrow:hover:not(.lbhdr){background:var(--blue-l)}
.lbrow.lbhdr{background:var(--navy2);cursor:default;padding:7px 14px}
.lbrow.lbme{background:#eff6ff;border-left:4px solid var(--blue2)}
.lbrank{font-family:var(--fh);font-size:18px;font-weight:700;color:var(--gray2)}
.gold{color:#d97706}.silver{color:#94a3b8}.bronze{color:#92400e}
.lbhdr .lbrank,.lbhdr .lbname,.lbhdr .lbpick,.lbhdr .lbpts,.lbhdr .lbups,.lbhdr .lbact{font-size:9px;color:rgba(255,255,255,.45);font-weight:600;text-transform:uppercase;letter-spacing:.07em;font-family:var(--fh)}
.lbname{font-size:12px;font-weight:500}
.lbpick{font-size:10px;color:var(--muted)}
.lbpts{font-family:var(--fh);font-size:15px;font-weight:700;text-align:right;color:var(--navy)}
.lbups{font-size:10px;color:var(--muted);text-align:center}
.lbhdr .lbpts,.lbhdr .lbups{text-align:right}
.lbact{text-align:right}
.vbtn{font-family:var(--fh);font-size:9px;padding:4px 10px;border:1.5px solid var(--blue);border-radius:3px;background:transparent;color:var(--blue);cursor:pointer;text-transform:uppercase;letter-spacing:.05em;transition:all .15s}
.vbtn:hover{background:var(--blue);color:var(--white)}
.lb-empty{padding:48px;text-align:center;color:var(--muted)}
.lb-note{font-size:10px;color:var(--muted);margin-top:8px;padding:0 4px;font-family:var(--fh);letter-spacing:.04em}
.viewing-banner{background:var(--blue);padding:9px 14px;font-size:11px;display:flex;align-items:center;justify-content:space-between;color:var(--white);border-radius:var(--rl) var(--rl) 0 0;font-weight:500;font-family:var(--fh);letter-spacing:.04em;text-transform:uppercase;margin-bottom:14px}
.back-link{color:var(--white);cursor:pointer;text-decoration:underline;font-weight:600}
</style>
</head>
<body>

<!-- save is now direct, no confirmation modal needed -->

<!-- AUTH -->
<div class="auth-screen" id="auth-screen">
  <div class="auth-bg" id="authBg"></div>
  <div class="auth-bg-overlay"></div>
  <div class="auth-inner">
    <div class="auth-eyebrow">2026 NCAA Men's Lacrosse Championship</div>
    <div class="auth-wordmark">Bracket<br/><span>Battle</span></div>
    <div class="auth-tag">Make your picks · Track results · Win bragging rights</div>
    <div class="auth-rule"></div>
    <div class="auth-card">
      <div class="auth-card-hdr"><div class="auth-card-title">Player Access</div></div>
      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-li" onclick="switchAuthTab('login')">Sign In</div>
        <div class="auth-tab" id="tab-re" onclick="switchAuthTab('register')">Register</div>
      </div>
      <div class="auth-body">

// Clear QF/SF/Final picks that are no longer valid given current FR picks.

function sanitizePicks(p){
  QF.forEach(function(g){
    if(p[g.id]){
      var vA=p[g.frA],vB=p[g.frB];
      if(p[g.id]!==vA&&p[g.id]!==vB)p[g.id]=null;
    }
  });
  SF.forEach(function(g){
    if(p[g.id]){
      var vA=p[g.qfA],vB=p[g.qfB];
      if(p[g.id]!==vA&&p[g.id]!==vB)p[g.id]=null;
    }
  });
  if(p.fin&&p.fin!==p.sf1&&p.fin!==p.sf2)p.fin=null;
  return p;
}

// ── SUPABASE ──
async function h256(s){try{var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return 'f'+Math.abs(h).toString(16);}}
async function sb(path,method,body){var o={method:method||'GET',headers:{'apikey':SKEY,'Authorization':'Bearer '+SKEY,'Content-Type':'application/json','Prefer':'return=representation'}};if(body)o.body=JSON.stringify(body);var r=await fetch(SURL+'/rest/v1/'+path,o);var j=await r.json().catch(function(){return null;});return{ok:r.ok,data:j};}
async function dbUser(u){var r=await sb('users?username=eq.'+encodeURIComponent(u)+'&select=username,password_hash');return(r.ok&&r.data&&r.data.length)?r.data[0]:null;}
async function dbCreate(u,h){return(await sb('users','POST',{username:u,password_hash:h})).ok;}
async function dbGetPicks(u){var r=await sb('picks?username=eq.'+encodeURIComponent(u)+'&select=picks,locked');return(r.ok&&r.data&&r.data.length)?r.data[0]:null;}
async function dbSave(u,p){var c=await sb('picks?username=eq.'+encodeURIComponent(u),'GET');var pl={picks:p,updated_at:new Date().toISOString(),locked:false};if(c.ok&&c.data&&c.data.length){return(await sb('picks?username=eq.'+encodeURIComponent(u),'PATCH',pl)).ok;}else{pl.username=u;return(await sb('picks','POST',pl)).ok;}}
async function dbAll(){var r=await sb('picks?select=username,picks,locked');return(r.ok&&r.data)?r.data:[];}

// ── ODDS BAR ──
function oddsBar(k1,k2){
  if(!k1||!k2||!T[k1]||!T[k2])return'';
  var o1=T[k1].o,o2=T[k2].o,tot=o1+o2,p1=Math.round(o1/tot*100),p2=100-p1;
  var n1=T[k1].n.split(' ').slice(-1)[0],n2=T[k2].n.split(' ').slice(-1)[0];
  return'<div class="card-odds"><div class="odds-row"><span class="odds-lbl">'+n1+' '+p1+'%</span><span class="odds-lbl">'+n2+' '+p2+'%</span></div><div class="odds-track"><div class="odds-a" style="width:'+p1+'%"></div><div class="odds-b" style="width:'+p2+'%"></div></div><div class="odds-src">Championship futures · implied win probability</div></div>';
}

// ── TEAM ROW ──
function teamRow(gameId, teamKey, myPick, result, lk){
  var isW=result===teamKey;
  var isE=result&&result!==teamKey;
  var isPick=myPick===teamKey;
  var td=T[teamKey];
  var cls='team-row';
  if(!lk&&!isPick)cls+=' pickable';
  if(isPick)cls+=' is-pick';
  if(isW)cls+=' is-winner';
  if(isE)cls+=' is-elim';
  if(lk)cls+=' is-locked';
  var oc=(!lk&&!isPick)?'onclick="doPick(\''+gameId+'\',\''+teamKey+'\')"':'';
  return'<div class="'+cls+'" '+oc+' title="'+(lk?'Picks are locked':isPick?'Selected — click ✕ to remove':'Select '+td.n)+'">'
    +(td.s?'<span class="t-seed">'+td.s+'</span>':'<span class="t-seed"></span>')
    +'<div class="t-info"><span class="t-name">'+td.n+'</span><div class="t-rec">'+td.r+'</div></div>'
    +(isW&&!isPick?'<div class="t-adv">Adv</div>':'')
    +(lk&&!isE&&!isPick?'<div class="t-lock-icon">🔒</div>':'')
    +(isPick&&!lk?'<button class="t-clear" onclick="event.stopPropagation();clearOnly(\''+gameId+'\')" title="Remove this pick">✕</button>':'')
    +'</div>';
}

    +'<div class="t-mascot-ph" style="opacity:.3">TBD</div>'
    +'<div class="t-info"><div class="t-name" style="color:#aaa;font-size:11px;font-family:var(--fb)">To be determined</div></div>'
    +'</div>';
}

// ── BUILD CARD ──
function buildCard(gameId, teamA, teamB, loc, time, myPick, result, lk, advLabel){
  var hasPick=myPick&&(myPick===teamA||myPick===teamB);
  var needsPick=!lk&&teamA&&teamB&&!myPick;
  var unavail=!teamA||!teamB;
  var cls='card';
  if(hasPick)cls+=' has-pick';
  else if(needsPick)cls+=' needs-pick';
  else if(unavail&&!lk)cls+=' unavailable';
  var showOdds=teamA&&teamB&&T[teamA]&&T[teamB];
  return'<div class="'+cls+'">'
    +'<div class="card-header"><span class="card-loc">📍 '+loc+'</span><span class="card-time">'+time+'</span></div>'
    +(teamA?teamRow(gameId,teamA,myPick,result,lk||unavail):lk?emptyLockedRow():emptyRow(''))
    +(teamB?teamRow(gameId,teamB,myPick,result,lk||unavail):lk?emptyLockedRow():emptyRow(''))
    +(showOdds?oddsBar(teamA,teamB):'')
    +(advLabel?'<div class="card-adv">→ Winner advances to '+advLabel+'</div>':'')
    +'</div>';
}

// ── PICK / CLEAR ──
function doPick(gameId, teamKey){
  if(VU||past())return;
  picks[gameId]=teamKey;
  redraw();
}

// Clear ONLY this slot — no cascade
function clearOnly(gameId){
  if(VU||past())return;
  picks[gameId]=null;
  redraw();
}

// ── DEADLINE BANNER ──
function deadlineBanner(){
  if(past())return'<div class="deadline-banner expired"><div class="deadline-icon">🚫</div><div class="deadline-text"><strong>Submissions Closed</strong>The May 9 · 12:00 PM ET deadline has passed. Picks can no longer be saved.</div></div>';
  var d=DEADLINE-new Date(),h=Math.floor(d/3600000),m=Math.floor((d%3600000)/60000),s=Math.floor((d%60000)/1000);
  return'<div class="deadline-banner live"><div class="deadline-icon">⏰</div><div class="deadline-text"><strong>Saved brackets will be locked on Friday, May 9 at 12PM EST. Save your bracket now!</strong></div><div class="deadline-cd"><span id="cd-val">'+h+'h '+String(m).padStart(2,'0')+'m '+String(s).padStart(2,'0')+'s</span></div></div>';
}

// ── ROUND TABS ──
function roundTabsHTML(p, lk){
  var frDone=frComplete(p),qfDone=qfComplete(p),sfDone=sfComplete(p);
  var qfUnlocked=frDone,sfUnlocked=frDone&&qfDone,finUnlocked=frDone&&qfDone&&sfDone;

  function tab(id,label,unlocked,count,total){
    var isActive=ACTIVE_ROUND===id;
    var cls='round-tab';
    if(isActive)cls+=' active';
    else if(unlocked||id==='fr')cls+=' unlocked';
    else cls+=' locked';
    var badge=count>0&&count<total?'<span class="tab-badge">'+count+'/'+total+'</span>':'';
    if(count===total&&total>0)badge='<span class="tab-badge">✓</span>';
    var lockIcon=(!unlocked&&id!=='fr')?'<span class="tab-lock">🔒</span>':'';
    var onclick=(unlocked||id==='fr')&&!isActive?'onclick="switchRound(\''+id+'\')"':'';
    return'<div class="'+cls+'" '+onclick+'>'+label+badge+lockIcon+'</div>';
  }

  return'<div class="round-tabs">'
    +tab('fr','First Round',true,frCount(p),8)
    +tab('qf','Quarterfinals',qfUnlocked,qfCount(p),4)
    +tab('sf','Semifinals',sfUnlocked,sfCount(p),2)
    +tab('fin','Championship',finUnlocked,p.fin?1:0,1)
    +'</div>';
}

function switchRound(r){ACTIVE_ROUND=r;redraw();}

// ── MAIN RENDER ──
function redraw(ro, vu){
  ro=ro||false;vu=vu||null;
  var p=vu?viewPicks:picks;
  if(!p)p=blank();
  var lk=ro||past();
  var c=document.getElementById('apptab-bracket');

  var bannerH=vu?'<div class="viewing-banner"><span>👤 Viewing <strong>'+vu+'</strong>\'s Bracket</span><span class="back-link" onclick="backToMine()">← Back to Mine</span></div>':'';
  var dlH=!vu?deadlineBanner():'';
  var tabsH=roundTabsHTML(p,lk);

  var helpH=(!lk&&!vu)?'<div class="pick-help">'
    +'<div class="pick-help-line">Click a team to make your selection.</div>'
    +'<div class="pick-help-line">Complete selections on this tab to access the next round.</div>'
    +'<div class="pick-help-line">De-selecting a team will remove it from subsequent rounds.</div>'
    +'</div>':'';

  var gamesH='';

  if(ACTIVE_ROUND==='fr'){
    var cards=FR.map(function(g){
      return buildCard(g.id,g.a,g.b,g.loc,g.time+' · ESPNU',p[g.id],g.result,lk,'Quarterfinals');
    });
    gamesH='<div class="matchup-grid">'+cards.join('')+'</div>';

  }else if(ACTIVE_ROUND==='qf'){
    var qcards=QF.map(function(g){
      var tA=p[g.frA]||null,tB=p[g.frB]||null;
      var canPick=!!(tA&&tB);
      return buildCard(g.id,tA,tB,g.loc,g.time,p[g.id],g.result,lk||!canPick,'Semifinals');
    });
    gamesH='<div class="matchup-grid double">'+qcards.join('')+'</div>';

  }else if(ACTIVE_ROUND==='sf'){
    var sfcards=SF.map(function(g){
      var tA=p[g.qfA]||null,tB=p[g.qfB]||null;
      var canPick=!!(tA&&tB);
      return buildCard(g.id,tA,tB,g.loc,g.time,p[g.id],g.result,lk||!canPick,'Championship');
    });
    gamesH='<div class="matchup-grid double">'+sfcards.join('')+'</div>';

  }else if(ACTIVE_ROUND==='fin'){
    var fA=p[FIN.sfA]||null,fB=p[FIN.sfB]||null;
    var canPickF=!!(fA&&fB);
    gamesH='<div class="matchup-grid single">'+buildCard('fin',fA,fB,FIN.loc,FIN.time,p.fin,FIN.result,lk||!canPickF,null)+'</div>';
  }

  // Action bar
  var actionH='';
  if(!vu){
    if(past()){
      if(SAVED){
        actionH='<div class="locked-banner"><div class="locked-icon">🔒</div><div class="locked-text"><strong>Your bracket is locked</strong>The May 9 deadline has passed. Results update automatically as games are played. Check the leaderboard to track your score!</div></div>';
      }else{
        actionH='<div class="closed-banner"><div class="closed-icon">🚫</div><div class="closed-text"><strong>Submissions Closed</strong>The May 9 · 12pm ET deadline has passed. Picks can no longer be saved.</div></div>';
      }
    }else{
      var allDone=frComplete(p)&&qfComplete(p)&&sfComplete(p)&&p.fin;
      var saveLabel=SAVED?'💾 Update My Bracket':'💾 Save My Bracket';
      var saveHint=allDone?'':'Complete all picks before saving';
      actionH='<div class="save-bar">'
        +'<button class="btn-save" id="save-btn" onclick="doSave()" '+(allDone?'':'disabled title="Complete all 15 picks to save"')+'>'
        +saveLabel+'</button>'
        +(SAVED?'<span class="save-hint" style="color:var(--green)">✓ Bracket saved — you can update picks before the deadline</span>':'<span class="save-hint">'+saveHint+'</span>')
        +'<span class="save-msg" id="save-msg"></span>'
        +'</div>';
    }
  }

  var legH='<div class="legend">'
    +'<div class="li"><div class="ls" style="border:1.5px dashed var(--amber);background:var(--amber-l)"></div>Needs pick</div>'
    +'<div class="li"><div class="ls" style="border-left:5px solid var(--blue2);background:rgba(74,144,217,.08)"></div>Your pick</div>'
    +'<div class="li"><div class="ls" style="background:var(--green-l);border:1px solid var(--green)"></div>Advanced</div>'
    +'<div class="li"><div class="ls" style="opacity:.28;background:var(--muted)"></div>Eliminated</div>'
    +'<div class="li">✕ removes pick from this round only</div>'
    +'</div>';

  c.innerHTML=bannerH+dlH+tabsH+helpH+gamesH+actionH+legH;

  loadLogos();
  if(!past()&&!vu)startCD();
}

function loadLogos(){/* logos removed — team names are the pick targets */}

// ── SAVE (no lock — re-saveable until deadline) ──
async function doSave(){
  if(past()){alert('The submission deadline has passed.');return;}
  var allDone=frComplete(picks)&&qfComplete(picks)&&sfComplete(picks)&&picks.fin;
  if(!allDone){alert('Please complete all picks before saving.');return;}
  var btn=document.getElementById('save-btn'),msg=document.getElementById('save-msg');
  if(btn)btn.disabled=true;if(msg){msg.textContent='Saving…';msg.style.color='var(--muted)';}
  try{
    var ok=await dbSave(CU,picks);
    if(ok){
      SAVED=true;
      document.getElementById('hdr-user').textContent=CU+' ✓';
      if(msg)msg.textContent='';
      redraw();
    }else{
      if(msg){msg.textContent='Error — please try again.';msg.style.color='var(--red)';}
      if(btn)btn.disabled=false;
    }
  }catch(e){
    if(msg){msg.textContent='Error: '+e.message;msg.style.color='var(--red)';}
    if(btn)btn.disabled=false;
  }
}

function backToMine(){VU=null;viewPicks=null;ACTIVE_ROUND='fr';redraw();}

// ── LEADERBOARD ──
function calcScore(p){
  var w=0,u=0;
  FR.forEach(function(g){if(g.result&&p[g.id]===g.result){w++;var ws=parseInt((T[g.result]&&T[g.result].s||'').replace('#','')||99),ls=parseInt((T[g.result===g.a?g.b:g.a]&&T[g.result===g.a?g.b:g.a].s||'').replace('#','')||0);if(ws>ls)u++;}});
  QF.forEach(function(g){if(g.result&&p[g.id]===g.result)w++;});
  return{wins:w,upsets:u,score:w*10};
}

async function renderLB(){
  var c=document.getElementById('apptab-leaderboard');
  c.innerHTML='<div style="padding:40px;text-align:center;color:var(--muted);font-family:var(--fh);letter-spacing:.06em">LOADING…</div>';
  try{
    var all=await dbAll();
    // Show all brackets that have been saved (have a picks row), not filtered by locked
    var entries=all.filter(function(r){
      var p=r.picks||{};
      // Must have at least one pick to show (means they've saved something)
      return Object.keys(p).some(function(k){return p[k]!==null;});
    }).map(function(r){var sc=calcScore(r.picks||{});var ch=(r.picks||{}).fin;return{u:r.username,p:r.picks||{},wins:sc.wins,upsets:sc.upsets,score:sc.score,champ:ch&&T[ch]?T[ch].n:'—'};});
    entries.sort(function(a,b){if(b.wins!==a.wins)return b.wins-a.wins;if(b.upsets!==a.upsets)return b.upsets-a.upsets;return a.u.localeCompare(b.u);});
    var rows=entries.map(function(e,i){var me=e.u===CU;var rc='lbrank'+(i===0?' gold':i===1?' silver':i===2?' bronze':'');var md=i===0?'🥇 ':i===1?'🥈 ':i===2?'🥉 ':'';
      return'<div class="lbrow'+(me?' lbme':'')+'" onclick="viewBracket(\''+e.u+'\')">'
        +'<div class="'+rc+'">'+md+(i+1)+'</div>'
        +'<div class="lbname">'+e.u+(me?' <span style="font-size:9px;color:var(--muted)">(you)</span>':'')+'</div>'
        +'<div class="lbpick">'+e.champ+'</div><div class="lbpts">'+e.score+'</div>'
        +'<div class="lbups">'+e.upsets+'</div>'
        +'<div class="lbact"><button class="vbtn" onclick="event.stopPropagation();viewBracket(\''+e.u+'\')">View</button></div></div>';
    }).join('');
    c.innerHTML='<div class="lb-wrap"><div class="lb-hdr"><div class="lb-title">🏆 Leaderboard</div><div class="lb-count">'+entries.length+' saved bracket'+(entries.length!==1?'s':'')+' · 10 pts per correct pick</div></div>'
      +'<div class="lb-table"><div class="lbrow lbhdr"><div class="lbrank">#</div><div class="lbname">Player</div><div class="lbpick">Champion Pick</div><div class="lbpts">Score</div><div class="lbups">Upsets</div><div class="lbact"></div></div>'
      +(entries.length?rows:'<div class="lb-empty">No saved brackets yet — make your picks and save to appear here!</div>')
      +'</div></div><div class="lb-note">Tiebreaker: most correct upset picks. Brackets lock automatically on May 9 at 12pm ET.</div>';
  }catch(e){c.innerHTML='<div style="padding:30px;text-align:center;color:var(--red)">Error: '+e.message+'</div>';}
}

async function viewBracket(u){
  VU=u;
  document.getElementById('anav-bracket').classList.add('active');document.getElementById('anav-leaderboard').classList.remove('active');
  document.getElementById('apptab-leaderboard').style.display='none';document.getElementById('apptab-bracket').style.display='';
  try{var r=await dbGetPicks(u);viewPicks=r&&r.picks?Object.assign(blank(),r.picks):blank();ACTIVE_ROUND='fr';redraw(true,u);}
  catch(e){viewPicks=blank();redraw(true,u);}
}

document.getElementById('li-p').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
document.getElementById('re-p2').addEventListener('keydown',function(e){if(e.key==='Enter')doRegister();});
</script>
