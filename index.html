<!DOCTYPE html>
<html lang="en">
<head> 
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://ehall4444.github.io/bracket-battle"/>
<meta property="og:title" content="Bracket Battle — 2026 NCAA Men's Lacrosse"/>
<meta property="og:description" content="Make your picks for the 2026 NCAA DI Men's Lacrosse Championship!"/>
<meta property="og:image" content="https://ehall4444.github.io/bracket-battle/og-image.png"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bracket Battle — 2026 NCAA Men's Lacrosse</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --navy:#0d1f3c;--navy2:#162847;--navy3:#1e3560;
  --blue:#2563a8;--blue2:#4a90d9;--blue-l:#dbeafe;
  --white:#fff;--off:#f0f4f8;--gray:#dde3ea;--gray2:#b0bac6;
  --text:#111827;--muted:#64748b;--green:#15803d;--green-l:#dcfce7;
  --red:#b91c1c;--red-l:#fee2e2;--gold:#d97706;--gold-l:#fef3c7;
  --amber:#f59e0b;--amber-l:#fffbeb;
  --r:4px;--rl:8px;
  --fh:'Oswald',sans-serif;--fb:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);color:var(--text);font-size:13px;min-height:100vh;background:var(--off)}

/* ── AUTH ── */
.auth-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:var(--navy);position:relative;overflow:hidden}
.auth-bg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);gap:2px;opacity:.18}
.auth-bg img{width:100%;height:100%;object-fit:cover;filter:saturate(.6)}
.auth-bg-overlay{position:absolute;inset:0;background:linear-gradient(155deg,rgba(13,31,60,.97) 0%,rgba(13,31,60,.85) 100%)}
.auth-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%}
.auth-eyebrow{font-family:var(--fh);font-size:11px;letter-spacing:.22em;color:var(--blue2);text-transform:uppercase;margin-bottom:10px}
.auth-wordmark{font-family:var(--fh);font-size:60px;font-weight:700;color:var(--white);text-transform:uppercase;letter-spacing:.01em;line-height:.9;text-shadow:0 4px 24px rgba(0,0,0,.5);text-align:center}
.auth-wordmark span{color:var(--blue2)}
.auth-tag{font-size:11px;color:rgba(255,255,255,.45);letter-spacing:.1em;text-transform:uppercase;margin-top:14px;text-align:center}
.auth-rule{width:56px;height:3px;background:linear-gradient(90deg,var(--blue2),var(--blue));margin:18px auto 28px;border-radius:2px}
.auth-card{background:rgba(255,255,255,.98);border-radius:var(--rl);width:100%;max-width:400px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.6)}
.auth-card-hdr{background:var(--navy);padding:14px 22px;border-bottom:3px solid var(--blue2)}
.auth-card-title{font-family:var(--fh);font-size:16px;font-weight:600;color:var(--white);text-transform:uppercase;letter-spacing:.08em}
.auth-tabs{display:flex;background:var(--navy2)}
.auth-tab{flex:1;padding:11px;text-align:center;font-family:var(--fh);font-size:12px;font-weight:500;cursor:pointer;color:rgba(255,255,255,.38);border-bottom:3px solid transparent;transition:all .15s;text-transform:uppercase;letter-spacing:.08em}
.auth-tab.active{color:var(--white);border-bottom-color:var(--blue2)}
.auth-body{padding:22px}
.fl{font-family:var(--fh);font-size:10px;font-weight:500;color:var(--navy);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em}
.fi{width:100%;padding:10px 13px;border:1.5px solid var(--gray);border-radius:var(--r);background:var(--white);color:var(--text);font-size:13px;font-family:var(--fb);outline:none;transition:border .15s;margin-bottom:14px;display:block}
.fi:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(74,144,217,.15)}
.btn-primary{width:100%;padding:13px;background:var(--blue);color:var(--white);border:none;border-radius:var(--r);font-family:var(--fh);font-size:14px;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:.1em;transition:background .15s}
.btn-primary:hover{background:var(--navy)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.form-err{font-size:11px;color:var(--red);margin-top:9px;min-height:16px;line-height:1.4}
.form-info{font-size:11px;color:var(--blue2);margin-top:6px;min-height:16px}

/* ── SHELL ── */
.shell{display:none;flex-direction:column;min-height:100vh}

/* ── HERO BANNER — photo collage with branding overlay ── */
.hero{position:relative;overflow:hidden;height:260px;background:#0a1628;border-bottom:3px solid var(--blue2)}
.hero-photos{position:absolute;inset:0;display:flex;gap:2px}
.hero-photo{flex:1;overflow:hidden}
.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:center 25%;display:block;transition:transform .5s}
.hero-photo:hover img{transform:scale(1.05)}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,22,40,.95) 0%,rgba(10,22,40,.6) 40%,rgba(10,22,40,.15) 75%,transparent 100%)}
.hero-inner{position:absolute;inset:0;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;padding:20px 26px}
.hero-brand{display:flex;flex-direction:column}
.hero-eyebrow{font-family:var(--fh);font-size:10px;letter-spacing:.28em;color:var(--blue2);text-transform:uppercase;margin-bottom:6px;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.hero-title{font-family:var(--fh);font-size:48px;font-weight:700;color:var(--white);text-transform:uppercase;letter-spacing:.03em;line-height:.9;text-shadow:0 2px 16px rgba(0,0,0,.95)}
.hero-title span{color:var(--blue2)}
.hero-subtitle{font-family:var(--fh);font-size:11px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.14em;margin-top:8px;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.hero-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.hero-user{font-family:var(--fh);font-size:12px;color:var(--blue2);letter-spacing:.06em;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.hero-accent{font-family:var(--fh);font-size:9px;color:rgba(255,255,255,.55);letter-spacing:.12em;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.btn-so{padding:7px 18px;border:1.5px solid rgba(255,255,255,.45);border-radius:var(--r);background:rgba(0,0,0,.35);color:rgba(255,255,255,.9);font-family:var(--fh);font-size:11px;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;transition:all .15s;backdrop-filter:blur(4px)}
.btn-so:hover{border-color:var(--blue2);color:var(--white);background:rgba(74,144,217,.25)}

/* ── APP NAV ── */
.app-nav{background:var(--navy2);display:flex;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.app-nav-tab{padding:12px 18px;font-family:var(--fh);font-size:12px;font-weight:500;cursor:pointer;color:rgba(255,255,255,.4);border-bottom:3px solid transparent;transition:all .15s;text-transform:uppercase;letter-spacing:.08em;margin-bottom:-1px}
.app-nav-tab:hover{color:rgba(255,255,255,.8)}
.app-nav-tab.active{color:var(--white);border-bottom-color:var(--blue2)}
.main{padding:16px;flex:1;max-width:1100px;margin:0 auto;width:100%}

/* ── DEADLINE BANNER ── */
.deadline-banner{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--rl);margin-bottom:14px;font-size:12px}
.deadline-banner.live{background:var(--navy);border:1.5px solid var(--blue2);color:var(--white)}
.deadline-banner.expired{background:var(--red-l);border:1.5px solid var(--red);color:var(--red)}
.deadline-icon{font-size:20px;flex-shrink:0}
.deadline-text strong{display:block;font-family:var(--fh);font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.deadline-cd{font-family:'Courier New',monospace;font-size:14px;font-weight:700;color:var(--gold);margin-left:auto;white-space:nowrap;background:rgba(0,0,0,.25);padding:4px 10px;border-radius:4px}

/* ── ROUND TABS ── */
.round-tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.round-tab{display:flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--rl);font-family:var(--fh);font-size:12px;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;border:2px solid var(--gray);background:var(--white);color:var(--muted);transition:all .15s;user-select:none}
.round-tab.active{background:var(--navy);border-color:var(--navy);color:var(--white);box-shadow:0 4px 14px rgba(13,31,60,.25)}
.round-tab.unlocked:not(.active){background:var(--white);border-color:var(--blue2);color:var(--blue);cursor:pointer}
.round-tab.unlocked:not(.active):hover{background:var(--blue-l)}
.round-tab.locked{opacity:.45;cursor:not-allowed;pointer-events:none}
.round-tab .tab-badge{font-size:9px;background:var(--green-l);color:var(--green);border-radius:10px;padding:1px 6px;font-family:var(--fb);font-weight:600;letter-spacing:.02em}
.round-tab.active .tab-badge{background:rgba(255,255,255,.2);color:rgba(255,255,255,.8)}
.round-tab .tab-lock{font-size:11px;opacity:.6}
.round-progress{font-size:10px;color:var(--muted);margin-bottom:6px;font-family:var(--fh);letter-spacing:.04em;text-transform:uppercase}
.pick-help{background:var(--navy);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;border-left:4px solid var(--blue2)}
.pick-help-line{font-size:12px;color:var(--white);font-family:var(--fb);font-weight:500;line-height:1.7}

/* ── MATCHUP GRID ── */
.matchup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.matchup-grid.single{grid-template-columns:minmax(280px,480px);justify-content:center}
.matchup-grid.double{grid-template-columns:repeat(2,1fr)}

/* ── MATCHUP CARD ── */
.card{background:var(--white);border:1.5px solid var(--gray);border-radius:var(--rl);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.07);transition:border-color .15s,box-shadow .15s}
.card.has-pick{border-color:var(--blue2);border-width:2px;box-shadow:0 4px 20px rgba(74,144,217,.18)}
.card.needs-pick{border:1.5px dashed var(--amber)}
.card.unavailable{opacity:.5;pointer-events:none}

.card-header{background:var(--navy);padding:6px 12px;display:flex;justify-content:space-between;align-items:center}
.card-loc{font-size:8px;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.card-time{font-size:8px;color:var(--blue2);font-weight:600;font-family:var(--fh);letter-spacing:.04em;white-space:nowrap}

/* ── TEAM ROW ── */
.team-row{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;transition:background .12s,border-left-color .12s;border-left:4px solid transparent;position:relative;min-height:48px}
.team-row:first-of-type{border-bottom:1px solid var(--gray)}
.team-row.pickable:hover{background:rgba(74,144,217,.09)}
.team-row.pickable:hover .t-name{color:var(--blue)}
/* PICKED — ESPN-style: strong left border, subtle tint, bold name. No solid fill. */
.team-row.is-pick{border-left-color:var(--blue2);border-left-width:5px;background:rgba(74,144,217,.08);cursor:default}
.team-row.is-pick .t-name{color:var(--blue);font-weight:700}
.team-row.is-pick .t-seed{color:var(--blue2)}
.team-row.is-pick .t-rec{color:var(--muted)}
.team-row.is-pick:hover{background:rgba(74,144,217,.08)}
.team-row.is-winner .t-name{color:var(--green);font-weight:700}
.team-row.is-elim{opacity:.28;pointer-events:none}
.team-row.is-locked{cursor:default}
.team-row.is-empty{cursor:default;background:var(--amber-l)}
.team-row.is-empty-locked{cursor:default;background:var(--off)}

.t-seed{font-family:var(--fh);font-size:11px;font-weight:700;color:var(--muted);width:22px;flex-shrink:0;text-align:center}
.t-info{flex:1;min-width:0}
.t-name{font-family:var(--fh);font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;letter-spacing:.02em;color:inherit;transition:color .12s}
.t-rec{font-size:9px;color:var(--muted);margin-top:2px}
.t-adv{font-family:var(--fh);font-size:8px;background:var(--green-l);color:var(--green);border-radius:3px;padding:2px 6px;letter-spacing:.04em;flex-shrink:0}
.t-lock-icon{font-size:10px;opacity:.2;flex-shrink:0}

/* empty row */
.t-empty-icon{width:28px;height:28px;border-radius:4px;background:rgba(245,158,11,.15);border:1px dashed var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px}
.t-empty-label{font-family:var(--fh);font-size:11px;color:var(--amber);letter-spacing:.04em}
.t-empty-hint{font-size:9px;color:rgba(217,119,6,.6);margin-top:1px}

/* ✕ clear — ONLY clears this slot, no cascade */
.t-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:rgba(74,144,217,.15);border:1px solid rgba(74,144,217,.3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--blue);transition:all .15s;z-index:5;padding:0;line-height:1;font-weight:700}
.t-clear:hover{background:var(--red);border-color:var(--red);color:var(--white);transform:translateY(-50%) scale(1.1)}

/* odds */
.card-odds{padding:5px 12px 6px;background:rgba(240,244,248,.7);border-top:1px solid var(--gray)}
.odds-row{display:flex;justify-content:space-between;margin-bottom:3px}
.odds-lbl{font-size:8px;color:var(--muted);font-family:var(--fh);letter-spacing:.04em}
.odds-track{height:3px;border-radius:2px;background:var(--gray);overflow:hidden;display:flex}
.odds-a{height:100%;background:var(--blue2)}
.odds-b{height:100%;background:var(--gray2)}
.odds-src{font-size:7.5px;color:var(--muted);margin-top:2px;opacity:.75}

/* adv strip */
.card-adv{font-family:var(--fh);font-size:8px;color:rgba(74,144,217,.8);text-align:center;padding:4px;background:rgba(37,99,168,.05);border-top:1px solid rgba(37,99,168,.1);letter-spacing:.06em;text-transform:uppercase}

/* ── SAVE BAR ── */
.save-bar{margin-top:16px;padding:14px 16px;background:var(--white);border:1.5px solid var(--gray);border-radius:var(--rl);display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.btn-save{padding:10px 24px;background:var(--blue);color:var(--white);border:none;border-radius:var(--r);font-family:var(--fh);font-size:13px;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;transition:background .15s}
.btn-save:hover{background:var(--navy)}
.btn-save:disabled{opacity:.5;cursor:not-allowed}
.save-hint{font-size:11px;color:var(--muted)}
.save-msg{font-size:11px;font-weight:500}

.locked-banner{background:var(--navy);border:1.5px solid var(--blue2);border-radius:var(--r);padding:13px 16px;display:flex;align-items:center;gap:12px;margin-top:16px}
.locked-icon{font-size:22px}
.locked-text{font-size:12px;color:var(--white);line-height:1.5}
.locked-text strong{font-family:var(--fh);color:var(--blue2);font-size:14px;display:block;margin-bottom:2px;letter-spacing:.03em}
.closed-banner{background:var(--red-l);border:1.5px solid var(--red);border-radius:var(--r);padding:13px 16px;display:flex;align-items:center;gap:12px;margin-top:16px}
.closed-text{font-size:12px;color:var(--red);line-height:1.5}
.closed-text strong{font-family:var(--fh);font-size:14px;display:block;margin-bottom:2px}

/* ── COMMENTS PANEL ── */
.comments-panel{background:var(--white);border:1px solid var(--gray);border-radius:var(--rl);overflow:hidden;margin-top:16px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.comments-hdr{background:var(--navy);padding:9px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.comments-hdr-title{font-family:var(--fh);font-size:13px;font-weight:600;color:var(--white);text-transform:uppercase;letter-spacing:.06em}
.comments-hdr-count{font-size:10px;color:var(--blue2);font-family:var(--fh);letter-spacing:.04em}
.comments-body{display:none}
.comments-body.open{display:block}
.comments-input-row{display:flex;gap:8px;padding:12px 14px;border-bottom:1px solid var(--gray);background:var(--off);position:relative}
.comments-input{flex:1;padding:9px 12px;border:1.5px solid var(--gray2);border-radius:var(--r);font-family:var(--fb);font-size:13px;outline:none;resize:none;color:var(--text);background:var(--white);transition:border .15s}
.comments-input:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(74,144,217,.12)}
.comments-input::placeholder{color:var(--gray2);font-style:italic}
.comments-post-btn{padding:9px 18px;background:var(--blue);color:var(--white);border:none;border-radius:var(--r);font-family:var(--fh);font-size:12px;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:.06em;transition:background .15s;white-space:nowrap;align-self:flex-end}
.comments-post-btn:hover{background:var(--navy)}
.comments-post-btn:disabled{opacity:.5;cursor:not-allowed}
.comments-list{max-height:280px;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:10px}
.comment-item{display:flex;gap:10px;align-items:flex-start}
.comment-avatar{width:28px;height:28px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:11px;font-weight:700;color:var(--blue2);flex-shrink:0;text-transform:uppercase}
.comment-bubble{flex:1;min-width:0}
.comment-meta{display:flex;align-items:baseline;gap:6px;margin-bottom:3px}
.comment-user{font-family:var(--fh);font-size:11px;font-weight:700;color:var(--blue);text-transform:lowercase;letter-spacing:.02em}
.comment-user.me{color:var(--navy)}
.comment-time{font-size:9px;color:var(--muted)}
.comment-text{font-size:12px;color:var(--text);line-height:1.5;word-break:break-word}
.comment-mention{color:var(--blue);font-weight:600;font-family:var(--fh)}
.comment-text .comment-mention.me{color:var(--navy);background:rgba(37,99,168,.1);border-radius:3px;padding:0 3px}
.comment-reactions{display:flex;gap:8px;margin-top:5px}
.reaction-btn{display:flex;align-items:center;gap:3px;padding:2px 7px;border:1px solid var(--gray);border-radius:10px;background:transparent;cursor:pointer;font-size:11px;color:var(--muted);transition:all .15s;font-family:var(--fb)}
.reaction-btn:hover{border-color:var(--blue2);color:var(--blue)}
.reaction-btn.active-up{border-color:var(--blue2);background:var(--blue-l);color:var(--blue);font-weight:600}
.reaction-btn.active-down{border-color:var(--red);background:var(--red-l);color:var(--red);font-weight:600}
.comments-empty{padding:20px;text-align:center;color:var(--muted);font-size:12px;font-style:italic}
.comment-char{font-size:10px;color:var(--muted);text-align:right;padding:2px 14px 6px;background:var(--off)}
.comment-rate-msg{font-size:10px;color:var(--muted);padding:4px 14px 8px;background:var(--off);font-style:italic}
/* @ mention dropdown */
.mention-dropdown{position:absolute;bottom:calc(100% + 4px);left:14px;background:var(--white);border:1.5px solid var(--blue2);border-radius:var(--r);box-shadow:0 4px 16px rgba(0,0,0,.15);z-index:100;min-width:160px;max-height:180px;overflow-y:auto;display:none}
.mention-dropdown.show{display:block}
.mention-item{padding:7px 12px;font-family:var(--fh);font-size:12px;color:var(--navy);cursor:pointer;letter-spacing:.02em}
.mention-item:hover,.mention-item.selected{background:var(--blue-l);color:var(--blue)}
/* remember me */
.remember-row{display:flex;align-items:center;gap:8px;margin-top:6px;margin-bottom:12px}
.remember-row input[type=checkbox]{width:14px;height:14px;cursor:pointer;accent-color:var(--blue)}
.remember-row label{font-size:11px;color:var(--muted);cursor:pointer;font-family:var(--fb)}
/* ── SCORES ── */
.t-score{font-family:var(--fh);font-size:16px;font-weight:700;color:var(--navy);margin-left:auto;flex-shrink:0;min-width:24px;text-align:right}
.team-row.is-pick .t-score{color:#1a1100}
.team-row.is-winner .t-score{color:var(--green)}
.game-status-badge{display:inline-flex;align-items:center;font-family:var(--fh);font-size:9px;font-weight:700;color:var(--white);background:var(--navy3);border-radius:3px;padding:2px 7px;letter-spacing:.06em;text-transform:uppercase;margin-left:6px}
.game-status-badge.final{background:transparent;color:#f87171;font-weight:800;letter-spacing:.08em}
.game-status-badge.live{background:#dc2626;color:var(--white);animation:livepulse 1.4s ease-in-out infinite}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.55}}
/* ── ADMIN PANEL ── */
.admin-section{background:var(--white);border:1px solid var(--gray);border-radius:var(--rl);overflow:hidden;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.admin-section-hdr{background:var(--navy);padding:9px 14px;font-family:var(--fh);font-size:13px;font-weight:600;color:var(--white);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;justify-content:space-between}
.admin-src{font-size:9px;font-weight:400;color:var(--blue2);letter-spacing:.04em}
.admin-note{font-size:11px;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--gray);background:var(--off)}
.admin-game{display:grid;grid-template-columns:1fr 72px 28px 72px 1fr 120px 85px;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--gray)}
.admin-game:last-child{border-bottom:none}
.admin-name{font-family:var(--fh);font-size:11px;color:var(--navy);font-weight:600}
.admin-name.r{text-align:right}
.admin-score{width:100%;padding:6px;border:1.5px solid var(--gray2);border-radius:var(--r);font-family:var(--fh);font-size:16px;font-weight:700;text-align:center;color:var(--navy);outline:none}
.admin-score:focus{border-color:var(--blue2)}
.admin-vs{font-size:10px;color:var(--muted);text-align:center;font-family:var(--fh)}
.admin-status{padding:6px 4px;border:1.5px solid var(--gray2);border-radius:var(--r);font-family:var(--fh);font-size:10px;color:var(--navy);outline:none;width:100%}
.admin-btn{padding:7px 12px;background:var(--blue);color:var(--white);border:none;border-radius:var(--r);font-family:var(--fh);font-size:11px;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:.05em;transition:background .15s;white-space:nowrap}
.admin-btn:hover{background:var(--navy)}
.admin-btn.ok{background:var(--green)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding:9px 12px;background:var(--white);border:1px solid var(--gray);border-radius:var(--r)}
.li{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);font-family:var(--fh);letter-spacing:.03em}
.ls{width:10px;height:10px;border-radius:2px}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.modal{background:var(--white);border-radius:var(--rl);padding:30px 26px;max-width:380px;width:100%;box-shadow:0 32px 80px rgba(0,0,0,.5)}
.modal-icon{font-size:36px;text-align:center;margin-bottom:14px}
.modal-title{font-family:var(--fh);font-size:20px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.06em;text-align:center;margin-bottom:10px}
.modal-body{font-size:12px;color:#4a5568;text-align:center;line-height:1.7;margin-bottom:22px}
.modal-body strong{color:var(--red)}
.modal-btns{display:flex;gap:10px}
.modal-cancel{flex:1;padding:11px;border:1.5px solid var(--gray2);border-radius:var(--r);background:transparent;color:var(--muted);font-family:var(--fh);font-size:12px;font-weight:500;cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
.modal-cancel:hover{background:var(--off)}
.modal-confirm{flex:1;padding:11px;border:none;border-radius:var(--r);background:var(--red);color:var(--white);font-family:var(--fh);font-size:12px;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
.modal-confirm:hover{background:#991b1b}

/* leaderboard */
.lb-wrap{border-radius:var(--rl);overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.lb-hdr{background:var(--navy);padding:11px 16px;border-bottom:2px solid var(--blue2);display:flex;align-items:center;justify-content:space-between}
.lb-title{font-family:var(--fh);font-size:20px;font-weight:700;color:var(--white);text-transform:uppercase;letter-spacing:.06em}
.lb-count{font-size:10px;color:var(--blue2);font-family:var(--fh)}
.lb-table{background:var(--white);border:1px solid var(--gray);border-top:none}
.lbrow{display:grid;grid-template-columns:36px 1fr 110px 65px 70px 65px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--gray);cursor:pointer;transition:background .12s}
.lbrow:last-child{border-bottom:none}
.lbrow:hover:not(.lbhdr){background:var(--blue-l)}
.lbrow.lbhdr{background:var(--navy2);cursor:default;padding:7px 14px}
.lbrow.lbme{background:#eff6ff;border-left:4px solid var(--blue2)}
.lbrank{font-family:var(--fh);font-size:18px;font-weight:700;color:var(--gray2)}
.gold{color:#d97706}.silver{color:#94a3b8}.bronze{color:#92400e}
.lbhdr .lbrank,.lbhdr .lbname,.lbhdr .lbpick,.lbhdr .lbpts,.lbhdr .lbups,.lbhdr .lbact{font-size:9px;color:rgba(255,255,255,.45);font-weight:600;text-transform:uppercase;letter-spacing:.07em;font-family:var(--fh)}
.lbname{font-size:12px;font-weight:500}
.lbpick{font-size:10px;color:var(--muted)}
.lbpts{font-family:var(--fh);font-size:15px;font-weight:700;text-align:right;color:var(--navy)}
.lbups{font-size:10px;color:var(--muted);text-align:center}
.lbhdr .lbpts,.lbhdr .lbups{text-align:right}
.lbact{text-align:right}
.vbtn{font-family:var(--fh);font-size:9px;padding:4px 10px;border:1.5px solid var(--blue);border-radius:3px;background:transparent;color:var(--blue);cursor:pointer;text-transform:uppercase;letter-spacing:.05em;transition:all .15s}
.vbtn:hover{background:var(--blue);color:var(--white)}
.lb-empty{padding:48px;text-align:center;color:var(--muted)}
.lb-note{font-size:10px;color:var(--muted);margin-top:8px;padding:0 4px;font-family:var(--fh);letter-spacing:.04em}
.viewing-banner{background:var(--blue);padding:9px 14px;font-size:11px;display:flex;align-items:center;justify-content:space-between;color:var(--white);border-radius:var(--rl) var(--rl) 0 0;font-weight:500;font-family:var(--fh);letter-spacing:.04em;text-transform:uppercase;margin-bottom:14px}
.back-link{color:var(--white);cursor:pointer;text-decoration:underline;font-weight:600}
.chyron-wrap{overflow:hidden;background:var(--navy);border-top:3px solid var(--gold);border-bottom:3px solid var(--gold);padding:10px 0;margin-bottom:14px}
.chyron-track{display:inline-block;white-space:nowrap;animation:chyron-scroll 28s linear infinite}
.chyron-text{font-family:var(--fh);font-size:15px;font-weight:700;color:var(--white);letter-spacing:.18em;text-transform:uppercase;padding-right:120px}
.chyron-text span{color:var(--gold)}
@keyframes chyron-scroll{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}
</style>
</head>

<!-- AUTH -->
<div class="auth-screen" id="auth-screen">
  <div class="auth-bg" id="authBg"></div>
  <div class="auth-bg-overlay"></div>
  <div class="auth-inner">
    <div class="auth-eyebrow">2026 NCAA Men's Lacrosse Championship</div>
    <div class="auth-wordmark">Bracket<br/><span>Battle</span></div>
    <div class="auth-tag">Make your picks · Track results · Win bragging rights</div>
    <div class="auth-rule"></div>
    <div class="auth-card">
      <div class="auth-card-hdr"><div class="auth-card-title">Player Access</div></div>
      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-li" onclick="switchAuthTab('login')">Sign In</div>
        <div class="auth-tab" id="tab-re" onclick="switchAuthTab('register')">Register</div>
      </div>
      <div class="auth-body">
        <div id="login-form">
          <label class="fl">Username</label><input class="fi" id="li-u" placeholder="your username" autocomplete="username"/>
          <label class="fl">Password</label><input class="fi" id="li-p" type="password" placeholder="••••••••" autocomplete="current-password" style="margin-bottom:6px"/>
          <div class="remember-row"><input type="checkbox" id="li-remember"/><label for="li-remember">Remember me on this device</label></div>
          <button class="btn-primary" id="li-btn" onclick="doLogin()">Sign In</button>
          <div class="form-err" id="li-err"></div>
        </div>
        <div id="reg-form" style="display:none">
          <label class="fl">Username</label><input class="fi" id="re-u" placeholder="letters, numbers, underscores"/>
          <label class="fl">Password</label><input class="fi" id="re-p" type="password" placeholder="at least 6 characters"/>
          <label class="fl">Confirm Password</label><input class="fi" id="re-p2" type="password" placeholder="same again" style="margin-bottom:2px"/>
          <button class="btn-primary" id="re-btn" onclick="doRegister()">Create Account</button>
          <div class="form-err" id="re-err"></div>
          <div class="form-info" id="re-info"></div>
        </div>
      </div>
    </div>
  </div>
</div>

function espnKey(name){
  var n=name.toLowerCase();
  for(var k in T){if(n.indexOf(T[k].n.toLowerCase())!==-1)return k;}
  for(var kw in ESPN_MAP){if(n.indexOf(kw)!==-1)return ESPN_MAP[kw];}
  return null;
}

function espnStatus(ev){
  if(!ev||!ev.status)return'scheduled';
  var st=ev.status;
  if(st.type&&st.type.completed)return'Final';
  var state=st.type&&st.type.state;
  if(state==='pre')return'scheduled';
  var p=st.period||0;
  if(p===1)return'Q1';if(p===2)return'Q2';if(p===3)return'Q3';if(p>=4)return'Q4';
  return'Live';
}

function gameDateStr(d){var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return y+m+dd;}

async function fetchESPNScores(){
  try{
    var today=new Date();
    var gameDates=['20260509','20260510','20260516','20260517','20260523','20260525'];
    var toFetch=new Set([gameDateStr(today)]);
    gameDates.forEach(function(d){var gd=new Date(d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8)+'T12:00:00');if(gd<=today)toFetch.add(d);});
    var found=false;
    for(var dateStr of Array.from(toFetch)){
      var resp=await fetch('https://site.api.espn.com/apis/site/v2/sports/lacrosse/college-men/scoreboard?dates='+dateStr,{signal:AbortSignal.timeout(8000)});
      if(!resp.ok)continue;
      var data=await resp.json();
      if(!data||!data.events)continue;
      data.events.forEach(function(ev){
        var comp=ev.competitions&&ev.competitions[0];
        if(!comp||!comp.competitors||comp.competitors.length<2)return;
        var c0=comp.competitors[0],c1=comp.competitors[1];
        var kA=espnKey(c0.team&&c0.team.displayName||'');
        var kB=espnKey(c1.team&&c1.team.displayName||'');
        if(!kA||!kB)return;
        // Find which FR game this matches
        for(var i=0;i<FR.length;i++){
          var g=FR[i];
          var aFirst=(g.a===kA&&g.b===kB);
          var bFirst=(g.a===kB&&g.b===kA);
          if(aFirst||bFirst){
            SCORES[g.id]={
              score_a:aFirst?parseInt(c0.score||0):parseInt(c1.score||0),
              score_b:aFirst?parseInt(c1.score||0):parseInt(c0.score||0),
              status:espnStatus(ev)
            };
            // Also update game result if Final
            if(espnStatus(ev)==='Final'){
              var winnerKey=parseInt(c0.score||0)>parseInt(c1.score||0)?(aFirst?g.a:g.b):(aFirst?g.b:g.a);
              g.result=winnerKey;
            }
            found=true;break;
          }
        }
        // QF/SF/Final — match by any two known team keys
        var allGames=[].concat(QF,SF,[FIN]);
        for(var j=0;j<allGames.length;j++){
          var qg=allGames[j];
          var qa=SCORES[qg.id]?null:null; // already set?
          // Just store by team pair for QF/SF/Final
          var qA=picks[qg.frA||qg.qfA||qg.sfA]||null;
          var qB=picks[qg.frB||qg.qfB||qg.sfB]||null;
          if(!qA||!qB)continue;
          var qAFirst=(qA===kA&&qB===kB);
          var qBFirst=(qA===kB&&qB===kA);
          if(qAFirst||qBFirst){
            SCORES[qg.id]={
              score_a:qAFirst?parseInt(c0.score||0):parseInt(c1.score||0),
              score_b:qAFirst?parseInt(c1.score||0):parseInt(c0.score||0),
              status:espnStatus(ev)
            };
            found=true;break;
          }
        }
      });
    }
    if(found){SCORE_SRC='espn';return true;}
    return false;
  }catch(e){return false;}
}

async function fetchManualScores(){
  try{
    var r=await sb('scores?select=*','GET');
    if(r.ok&&r.data&&r.data.length){
      r.data.forEach(function(row){
        if(!SCORES[row.game_id]||SCORE_SRC!=='espn'){
          SCORES[row.game_id]={score_a:row.score_a||0,score_b:row.score_b||0,status:row.status||'scheduled'};
        }
      });
      if(SCORE_SRC!=='espn')SCORE_SRC='manual';
    }
  }catch(e){}
}

async function fetchScores(){
  var espnOk=await fetchESPNScores();
  if(!espnOk)await fetchManualScores();
  // Soft redraw — only update score elements without full re-render
  updateScoreDisplay();
}

function updateScoreDisplay(){
  Object.keys(SCORES).forEach(function(gid){
    var sc=SCORES[gid];
    if(!sc||sc.status==='scheduled')return;
    var elA=document.getElementById('sc-a-'+gid);
    var elB=document.getElementById('sc-b-'+gid);
    var elSt=document.getElementById('sc-st-'+gid);
    if(elA)elA.textContent=sc.score_a;
    if(elB)elB.textContent=sc.score_b;
    if(elSt){
      elSt.textContent=sc.status;
      var cls='game-status-badge';
      if(sc.status==='Final')cls+=' final';
      else cls+=' live';
      elSt.className=cls;
    }
  });
}

function startScorePolling(){
  fetchScores();
  clearInterval(scoreTimer);
  scoreTimer=setInterval(fetchScores,60000);
}

async function saveScoreToDB(gameId,scoreA,scoreB,status){
  var payload={game_id:gameId,score_a:scoreA,score_b:scoreB,status:status,updated_at:new Date().toISOString()};
  var check=await sb('scores?game_id=eq.'+encodeURIComponent(gameId),'GET');
  if(check.ok&&check.data&&check.data.length){return(await sb('scores?game_id=eq.'+encodeURIComponent(gameId),'PATCH',payload)).ok;}
  else{return(await sb('scores','POST',payload)).ok;}
}

// ── COUNTDOWN ──
function startCD(){
  clearInterval(cdTimer);
  if(past())return;
  cdTimer=setInterval(function(){
    var el=document.getElementById('cd-val');if(!el){clearInterval(cdTimer);return;}
    var d=DEADLINE-new Date();if(d<=0){clearInterval(cdTimer);redraw();return;}
    var h=Math.floor(d/3600000),m=Math.floor((d%3600000)/60000),s=Math.floor((d%60000)/1000);
    el.textContent=h+'h '+String(m).padStart(2,'0')+'m '+String(s).padStart(2,'0')+'s';
  },1000);
}

// ── SANITIZE PICKS ──
// Clear QF/SF/Final picks that are no longer valid given current FR picks.
// This fixes stale DB picks from before the FR round was added.
function sanitizePicks(p){
  QF.forEach(function(g){
    if(p[g.id]){
      var vA=p[g.frA],vB=p[g.frB];
      if(p[g.id]!==vA&&p[g.id]!==vB)p[g.id]=null;
    }
  });
  SF.forEach(function(g){
    if(p[g.id]){
      var vA=p[g.qfA],vB=p[g.qfB];
      if(p[g.id]!==vA&&p[g.id]!==vB)p[g.id]=null;
    }
  });
  if(p.fin&&p.fin!==p.sf1&&p.fin!==p.sf2)p.fin=null;
  return p;
}

// ── SUPABASE ──
async function h256(s){try{var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return 'f'+Math.abs(h).toString(16);}}
async function sb(path,method,body){var o={method:method||'GET',headers:{'apikey':SKEY,'Authorization':'Bearer '+SKEY,'Content-Type':'application/json','Prefer':'return=representation'}};if(body)o.body=JSON.stringify(body);var r=await fetch(SURL+'/rest/v1/'+path,o);var j=await r.json().catch(function(){return null;});return{ok:r.ok,data:j};}
async function dbUser(u){var r=await sb('users?username=eq.'+encodeURIComponent(u)+'&select=username,password_hash');return(r.ok&&r.data&&r.data.length)?r.data[0]:null;}
async function dbCreate(u,h){return(await sb('users','POST',{username:u,password_hash:h})).ok;}
async function dbGetPicks(u){var r=await sb('picks?username=eq.'+encodeURIComponent(u)+'&select=picks,locked');return(r.ok&&r.data&&r.data.length)?r.data[0]:null;}
async function dbSave(u,p){var c=await sb('picks?username=eq.'+encodeURIComponent(u),'GET');var pl={picks:p,updated_at:new Date().toISOString(),locked:false};if(c.ok&&c.data&&c.data.length){return(await sb('picks?username=eq.'+encodeURIComponent(u),'PATCH',pl)).ok;}else{pl.username=u;return(await sb('picks','POST',pl)).ok;}}
async function dbAll(){var r=await sb('picks?select=username,picks,locked');return(r.ok&&r.data)?r.data:[];}

async function doLogin(){
  var u=document.getElementById('li-u').value.trim().toLowerCase(),p=document.getElementById('li-p').value,err=document.getElementById('li-err');
  err.textContent='';if(!u||!p){err.textContent='Please fill in both fields.';return;}
  busy('li-btn',true,'Sign In');
  try{
    var user=await dbUser(u);if(!user){err.textContent='Username not found.';return;}
    var h=await h256(p);if(user.password_hash!==h){err.textContent='Incorrect password.';return;}
    CU=u;
    var sv=await dbGetPicks(u);
    var loaded=sv&&sv.picks?Object.assign(blank(),sv.picks):blank();
    picks=sanitizePicks(loaded);
    SAVED=!!(sv&&sv.picks);
    var rem=document.getElementById('li-remember');
    if(rem&&rem.checked)saveSession(u,h);else clearSession();
    launch();
  }
  catch(e){err.textContent='Connection error: '+e.message;}
  finally{busy('li-btn',false,'Sign In');}
}

async function doRegister(){
  var u=document.getElementById('re-u').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,''),p=document.getElementById('re-p').value,p2=document.getElementById('re-p2').value;
  var err=document.getElementById('re-err'),info=document.getElementById('re-info');err.textContent='';info.textContent='';

  busy('re-btn',true,'Create Account');info.textContent='Creating your account…';
  try{var ex=await dbUser(u);if(ex){err.textContent='Username taken — try another.';info.textContent='';return;}var h=await h256(p);var ok=await dbCreate(u,h);if(!ok){err.textContent='Could not create account.';info.textContent='';return;}info.textContent='Account created! Signing you in…';CU=u;SAVED=false;picks=blank();setTimeout(launch,600);}
  catch(e){err.textContent='Connection error: '+e.message;info.textContent='';}
  finally{busy('re-btn',false,'Create Account');}
}

// ── UNLOCK LOGIC ──
// FR always open. QF unlocks when all 8 FR picks made. SF when all 4 QF. Final when both SF.
function frComplete(p){return FR.every(function(g){return p[g.id]!==null;});}
function qfComplete(p){return QF.every(function(g){return p[g.id]!==null;});}
function sfComplete(p){return SF.every(function(g){return p[g.id]!==null;});}
function frCount(p){return FR.filter(function(g){return p[g.id]!==null;}).length;}
function qfCount(p){return QF.filter(function(g){return p[g.id]!==null;}).length;}
function sfCount(p){return SF.filter(function(g){return p[g.id]!==null;}).length;}

// ── ODDS BAR ──
function oddsBar(k1,k2){
  if(!k1||!k2||!T[k1]||!T[k2])return'';
  var o1=T[k1].o,o2=T[k2].o,tot=o1+o2,p1=Math.round(o1/tot*100),p2=100-p1;
  var n1=T[k1].n.split(' ').slice(-1)[0],n2=T[k2].n.split(' ').slice(-1)[0];
  return'<div class="card-odds"><div class="odds-row"><span class="odds-lbl">'+n1+' '+p1+'%</span><span class="odds-lbl">'+n2+' '+p2+'%</span></div><div class="odds-track"><div class="odds-a" style="width:'+p1+'%"></div><div class="odds-b" style="width:'+p2+'%"></div></div><div class="odds-src">Championship futures · implied win probability</div></div>';
}

// ── TEAM ROW ──
function teamRow(gameId, teamKey, isTeamA, myPick, result, lk){
  var isW=result===teamKey;
  var isE=result&&result!==teamKey;
  var isPick=myPick===teamKey;
  var td=T[teamKey];
  var cls='team-row';
  if(!lk&&!isPick)cls+=' pickable';
  if(isPick)cls+=' is-pick';
  if(isW)cls+=' is-winner';
  if(isE)cls+=' is-elim';
  if(lk)cls+=' is-locked';
  var oc=(!lk&&!isPick)?'onclick="doPick(\''+gameId+'\',\''+teamKey+'\')"':'';
  // Score display
  var sc=SCORES[gameId];
  var hasScore=sc&&sc.status&&sc.status!=='scheduled';
  var scoreVal=hasScore?(isTeamA?sc.score_a:sc.score_b):null;
  var scoreH=hasScore?'<span class="t-score" id="sc-'+(isTeamA?'a':'b')+'-'+gameId+'">'+scoreVal+'</span>':'';
  return'<div class="'+cls+'" '+oc+' title="'+(lk?'Picks are locked':isPick?'Selected — click ✕ to remove':'Select '+td.n)+'">'
    +(td.s?'<span class="t-seed">'+td.s+'</span>':'<span class="t-seed"></span>')
    +'<div class="t-info"><span class="t-name">'+td.n+'</span><div class="t-rec">'+td.r+'</div></div>'
    +scoreH
    +(isW&&!isPick?'<div class="t-adv">Adv</div>':'')
    +(lk&&!isE&&!isPick?'<div class="t-lock-icon">🔒</div>':'')
    +(isPick&&!lk?'<button class="t-clear" onclick="event.stopPropagation();clearOnly(\''+gameId+'\')" title="Remove this pick">✕</button>':'')
    +'</div>';
}

// Empty slot row
function emptyRow(hint){

    +'<div class="t-empty-icon">⬡</div>'
    +'<div class="t-info"><div class="t-empty-label">Pick a winner</div><div class="t-empty-hint">'+(hint||'Select a team above')+'</div></div>'
    +'</div>';
}
function emptyLockedRow(){
  return'<div class="team-row is-empty-locked">'
    +'<div class="t-mascot-ph" style="opacity:.3">TBD</div>'
    +'<div class="t-info"><div class="t-name" style="color:#aaa;font-size:11px;font-family:var(--fb)">To be determined</div></div>'
    +'</div>';
}

// ── BUILD CARD ──
function buildCard(gameId, teamA, teamB, loc, time, myPick, result, lk, advLabel){
  var hasPick=myPick&&(myPick===teamA||myPick===teamB);
  var needsPick=!lk&&teamA&&teamB&&!myPick;
  var unavail=!teamA||!teamB;
  var cls='card';
  if(hasPick)cls+=' has-pick';
  else if(needsPick)cls+=' needs-pick';
  else if(unavail&&!lk)cls+=' unavailable';
  var showOdds=teamA&&teamB&&T[teamA]&&T[teamB];
  var sc=SCORES[gameId];
  var hasStatus=sc&&sc.status&&sc.status!=='scheduled';
  var statusCls=sc&&sc.status==='Final'?' final':' live';
  var statusH=hasStatus?'<span class="game-status-badge'+statusCls+'" id="sc-st-'+gameId+'">'+sc.status+'</span>':'';
  return'<div class="'+cls+'">'
    +'<div class="card-header"><span class="card-loc">📍 '+loc+'</span><span class="card-time">'+time+'</span>'+statusH+'</div>'
    +(teamA?teamRow(gameId,teamA,true,myPick,result,lk||unavail):lk?emptyLockedRow():emptyRow(''))
    +(teamB?teamRow(gameId,teamB,false,myPick,result,lk||unavail):lk?emptyLockedRow():emptyRow(''))
    +(showOdds?oddsBar(teamA,teamB):'')
    +(advLabel?'<div class="card-adv">→ Winner advances to '+advLabel+'</div>':'')
    +'</div>';
}

// Clear ONLY this slot — no cascade
function clearOnly(gameId){
  if(VU||past())return;
  picks[gameId]=null;
  redraw();
}

  var d=DEADLINE-new Date(),h=Math.floor(d/3600000),m=Math.floor((d%3600000)/60000),s=Math.floor((d%60000)/1000);
  return'<div class="deadline-banner live"><div class="deadline-icon">⏰</div><div class="deadline-text"><strong>Saved brackets will be locked on Saturday, May 9 at 12PM EST. Save your bracket now!</strong></div><div class="deadline-cd"><span id="cd-val">'+h+'h '+String(m).padStart(2,'0')+'m '+String(s).padStart(2,'0')+'s</span></div></div>';
}

// ── ROUND TABS ──
function roundTabsHTML(p, lk){
  var frDone=frComplete(p),qfDone=qfComplete(p),sfDone=sfComplete(p);
  var qfUnlocked=frDone,sfUnlocked=frDone&&qfDone,finUnlocked=frDone&&qfDone&&sfDone;

  function tab(id,label,unlocked,count,total){
    var isActive=ACTIVE_ROUND===id;
    var cls='round-tab';
    if(isActive)cls+=' active';
    else if(unlocked||id==='fr')cls+=' unlocked';
    else cls+=' locked';
    var badge=count>0&&count<total?'<span class="tab-badge">'+count+'/'+total+'</span>':'';
    if(count===total&&total>0)badge='<span class="tab-badge">✓</span>';
    var lockIcon=(!unlocked&&id!=='fr')?'<span class="tab-lock">🔒</span>':'';
    var onclick=(unlocked||id==='fr')&&!isActive?'onclick="switchRound(\''+id+'\')"':'';
    return'<div class="'+cls+'" '+onclick+'>'+label+badge+lockIcon+'</div>';
  }

  return'<div class="round-tabs">'
    +tab('fr','First Round',true,frCount(p),8)
    +tab('qf','Quarterfinals',qfUnlocked,qfCount(p),4)
    +tab('sf','Semifinals',sfUnlocked,sfCount(p),2)
    +tab('fin','Championship',finUnlocked,p.fin?1:0,1)
    +'</div>';
}

      var canPick=!!(tA&&tB);

      var saveLabel=SAVED?'Update My Bracket':'Save My Bracket';
      var saveHint=allDone?'':'Complete all picks before saving';

        +'<button class="btn-save" id="save-btn" onclick="doSave()" '+(allDone?'':'disabled title="Complete all 15 picks to save"')+'>'

// ── SAVE (no lock — re-saveable until deadline) ──
async function doSave(){
  if(past()){alert('The submission deadline has passed.');return;}
  var allDone=frComplete(picks)&&qfComplete(picks)&&sfComplete(picks)&&picks.fin;
  if(!allDone){alert('Please complete all picks before saving.');return;}
  var btn=document.getElementById('save-btn'),msg=document.getElementById('save-msg');
  if(btn)btn.disabled=true;if(msg){msg.textContent='Saving…';msg.style.color='var(--muted)';}
  try{
    var ok=await dbSave(CU,picks);
    if(ok){
      SAVED=true;
      document.getElementById('hdr-user').textContent=CU+' ✓';
      if(msg)msg.textContent='';
      redraw();
    }else{
      if(msg){msg.textContent='Error — please try again.';msg.style.color='var(--red)';}
      if(btn)btn.disabled=false;
    }
  }catch(e){
    if(msg){msg.textContent='Error: '+e.message;msg.style.color='var(--red)';}
    if(btn)btn.disabled=false;
  }
}

// ── LEADERBOARD ──
function calcScore(p){
  var w=0,u=0;
  FR.forEach(function(g){if(g.result&&p[g.id]===g.result){w++;var ws=parseInt((T[g.result]&&T[g.result].s||'').replace('#','')||99),ls=parseInt((T[g.result===g.a?g.b:g.a]&&T[g.result===g.a?g.b:g.a].s||'').replace('#','')||0);if(ws>ls)u++;}});
  QF.forEach(function(g){if(g.result&&p[g.id]===g.result)w++;});
  return{wins:w,upsets:u,score:w*10};
}

   }

    }).map(function(r){

      var ch=(r.picks||{}).fin;

      return a.u.localeCompare(b.u);

    var over=tourneyOver();

  var stEl=document.getElementById('adm-st-'+gid);

// ── COMMENTS & REACTIONS ──
var COMMENTS=[];
var REACTIONS={}; // comment_id → {up:N, down:N, mine: +1|-1|0}
var commentTimer=null;
var COMMENTS_OPEN=true;
var LAST_POST_TIME=0; // rate limit: epoch ms of last post
var RATE_LIMIT_MS=60000;
var KNOWN_USERS=[]; // usernames of bracket-savers for @ mentions
var mentionDropdownActive=false;
var mentionQuery='';
var mentionStart=-1; // cursor position where @ was typed
var activePanelId='';

async function fetchKnownUsers(){
  try{
    // Only fetch usernames of users who have saved a bracket (picks table)
    var r=await sb('picks?select=username','GET');
    if(r.ok&&r.data){KNOWN_USERS=r.data.map(function(row){return row.username;}).filter(function(u){return u!==CU;}).sort();}
  }catch(e){}
}

async function fetchComments(){
  try{
    var r=await sb('comments?select=id,username,body,created_at&order=created_at.desc&limit=60','GET');
    if(!r.ok||!r.data)return;
    COMMENTS=r.data;
    // Fetch reactions for these comment ids
    if(COMMENTS.length){
      var ids=COMMENTS.map(function(c){return c.id;}).join(',');
      var rr=await sb('comment_reactions?comment_id=in.('+ids+')&select=comment_id,username,vote','GET');
      REACTIONS={};
      if(rr.ok&&rr.data){
        rr.data.forEach(function(row){
          if(!REACTIONS[row.comment_id])REACTIONS[row.comment_id]={up:0,down:0,mine:0};
          if(row.vote===1)REACTIONS[row.comment_id].up++;
          else if(row.vote===-1)REACTIONS[row.comment_id].down++;
          if(row.username===CU)REACTIONS[row.comment_id].mine=row.vote;
        });
      }
    }
    updateCommentsDisplay();
  }catch(e){}
}

async function toggleReaction(commentId,vote){
  if(!CU)return;
  var r=REACTIONS[commentId]||{up:0,down:0,mine:0};
  var newVote=r.mine===vote?0:vote; // toggle off if same
  // Optimistic update
  if(r.mine===1)r.up=Math.max(0,r.up-1);
  if(r.mine===-1)r.down=Math.max(0,r.down-1);
  r.mine=newVote;
  if(newVote===1)r.up++;
  if(newVote===-1)r.down++;
  REACTIONS[commentId]=r;
  updateCommentsDisplay();
  try{
    // Upsert: delete existing then insert if non-zero
    await sb('comment_reactions?comment_id=eq.'+commentId+'&username=eq.'+encodeURIComponent(CU),'DELETE');
    if(newVote!==0){await sb('comment_reactions','POST',{comment_id:commentId,username:CU,vote:newVote});}
  }catch(e){}
}

function startCommentPolling(){
  fetchComments();
  fetchKnownUsers();
  clearInterval(commentTimer);
  commentTimer=setInterval(fetchComments,30000);
}

function timeAgo(iso){
  var d=new Date(iso),now=new Date(),diff=Math.floor((now-d)/1000);
  if(diff<60)return'just now';
  if(diff<3600)return Math.floor(diff/60)+'m ago';
  if(diff<86400)return Math.floor(diff/3600)+'h ago';
  return Math.floor(diff/86400)+'d ago';
}

function renderMentions(text){
  // Highlight @username patterns — bold blue, extra highlight if mentioning current user
  return escapeHTML(text).replace(/@([a-z0-9_]+)/gi,function(match,name){
    var isMe=CU&&name.toLowerCase()===CU.toLowerCase();
    return'<span class="comment-mention'+(isMe?' me':'')+'">@'+name+'</span>';
  });
}

function updateCommentsDisplay(){
  document.querySelectorAll('.comments-hdr-count').forEach(function(el){
    el.textContent=COMMENTS.length+' comment'+(COMMENTS.length!==1?'s':'');
  });
  document.querySelectorAll('.comments-list').forEach(function(list){
    if(!COMMENTS.length){list.innerHTML='<div class="comments-empty">No comments yet — be the first to talk trash 🏒</div>';return;}
    list.innerHTML=COMMENTS.map(function(c){
      var initials=c.username.substring(0,2).toUpperCase();
      var isMe=c.username===CU;
      var rx=REACTIONS[c.id]||{up:0,down:0,mine:0};
      var upCls='reaction-btn'+(rx.mine===1?' active-up':'');
      var downCls='reaction-btn'+(rx.mine===-1?' active-down':'');
      return'<div class="comment-item">'
        +'<div class="comment-avatar">'+initials+'</div>'
        +'<div class="comment-bubble">'
        +'<div class="comment-meta"><span class="comment-user'+(isMe?' me':'')+'">'+escapeHTML(c.username)+'</span><span class="comment-time">'+timeAgo(c.created_at)+'</span></div>'
        +'<div class="comment-text">'+renderMentions(c.body)+'</div>'
        +'<div class="comment-reactions">'
        +'<button class="'+upCls+'" onclick="toggleReaction('+c.id+',1)">👍 '+rx.up+'</button>'
        +'<button class="'+downCls+'" onclick="toggleReaction('+c.id+',-1)">👎 '+rx.down+'</button>'
        +'</div>'
        +'</div></div>';
    }).join('');
  });
}

function escapeHTML(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

function toggleComments(){
  COMMENTS_OPEN=!COMMENTS_OPEN;
  document.querySelectorAll('.comments-body').forEach(function(el){el.classList.toggle('open',COMMENTS_OPEN);});
  document.querySelectorAll('.comments-chev').forEach(function(el){el.textContent=COMMENTS_OPEN?'▲':'▼';});
}

function commentCharCount(el){
  var remaining=280-el.value.length;
  var counter=el.closest('.comments-panel').querySelector('.comment-char');
  if(counter)counter.textContent=remaining<50?remaining+' characters remaining':'';
  handleMentionTyping(el);
}

// ── @ MENTION AUTOCOMPLETE ──
function handleMentionTyping(textarea){
  var val=textarea.value;
  var pos=textarea.selectionStart;
  var dropdown=textarea.closest('.comments-input-row').querySelector('.mention-dropdown');
  if(!dropdown)return;
  // Find if cursor is inside an @word
  var before=val.substring(0,pos);
  var atMatch=before.match(/@([a-z0-9_]*)$/i);
  if(!atMatch){dropdown.classList.remove('show');mentionDropdownActive=false;return;}
  mentionQuery=atMatch[1].toLowerCase();
  mentionStart=pos-atMatch[0].length;
  activePanelId=textarea.id.replace('comment-input-','');
  var matches=KNOWN_USERS.filter(function(u){return u.startsWith(mentionQuery);}).slice(0,6);
  if(!matches.length){dropdown.classList.remove('show');mentionDropdownActive=false;return;}
  dropdown.innerHTML=matches.map(function(u,i){
    return'<div class="mention-item'+(i===0?' selected':'')+'" onmousedown="event.preventDefault();insertMention(\''+u+'\',\''+textarea.id+'\')">@'+u+'</div>';
  }).join('');
  dropdown.classList.add('show');
  mentionDropdownActive=true;
}

function insertMention(username,inputId){
  var textarea=document.getElementById(inputId);
  if(!textarea)return;
  var val=textarea.value;
  var pos=textarea.selectionStart;
  var before=val.substring(0,pos);
  var after=val.substring(pos);
  var newBefore=before.replace(/@([a-z0-9_]*)$/i,'@'+username+' ');
  textarea.value=newBefore+after;
  textarea.selectionStart=textarea.selectionEnd=newBefore.length;
  textarea.focus();
  var dropdown=textarea.closest('.comments-input-row').querySelector('.mention-dropdown');
  if(dropdown)dropdown.classList.remove('show');
  mentionDropdownActive=false;
  commentCharCount(textarea);
}

// ── RATE LIMIT ──
var rateTimer=null;
function startRateCooldown(panelId){
  var btn=document.getElementById('comment-btn-'+panelId);
  var msg=document.querySelector('#comment-input-'+panelId+' ~ .comment-rate-msg') ||
           document.getElementById('rate-msg-'+panelId);
  var end=LAST_POST_TIME+RATE_LIMIT_MS;
  clearInterval(rateTimer);
  rateTimer=setInterval(function(){
    var remaining=Math.max(0,Math.ceil((end-Date.now())/1000));
    if(btn)btn.disabled=remaining>0;
    if(remaining<=0){
      clearInterval(rateTimer);
      document.querySelectorAll('.comment-rate-msg').forEach(function(el){el.textContent='';});
      document.querySelectorAll('.comments-post-btn').forEach(function(el){el.disabled=false;});
    }else{
      document.querySelectorAll('.comment-rate-msg').forEach(function(el){el.textContent='Wait '+remaining+'s before posting again';});
    }
  },500);
}

async function postComment(panelId){
  var input=document.getElementById('comment-input-'+panelId);
  if(!input||!CU)return;
  var body=input.value.trim();
  if(!body||body.length>280)return;
  // Client-side rate limit
  var now=Date.now();
  if(now-LAST_POST_TIME<RATE_LIMIT_MS){startRateCooldown(panelId);return;}
  var btn=document.getElementById('comment-btn-'+panelId);
  document.querySelectorAll('.comments-post-btn').forEach(function(el){el.disabled=true;});
  try{
    var r=await sb('comments','POST',{username:CU,body:body});
    if(r.ok){
      input.value='';
      commentCharCount(input);
      LAST_POST_TIME=Date.now();
      startRateCooldown(panelId);
      await fetchComments();
      document.querySelectorAll('.comments-list').forEach(function(el){el.scrollTop=0;});
    }
  }catch(e){}
  finally{/* rate limit controls re-enable */}
}

var placeholder=canPost?'':'Sign in to comment';

    }).join(''):'<div class="comments-empty">No comments yet — be the first to talk trash 🏒</div>')

function handleCommentKey(e,panelId){
  if(mentionDropdownActive){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='Enter'||e.key==='Escape'){
      e.preventDefault();
      var dd=document.getElementById('mention-dd-'+panelId);
      if(!dd)return;
      var items=dd.querySelectorAll('.mention-item');
      if(!items.length)return;
      if(e.key==='Escape'){dd.classList.remove('show');mentionDropdownActive=false;return;}
      var sel=dd.querySelector('.mention-item.selected');
      if(e.key==='Enter'&&sel){sel.dispatchEvent(new MouseEvent('mousedown'));return;}
      var idx=Array.from(items).indexOf(sel);
      if(e.key==='ArrowDown')idx=Math.min(idx+1,items.length-1);
      if(e.key==='ArrowUp')idx=Math.max(idx-1,0);
      items.forEach(function(it,i){it.classList.toggle('selected',i===idx);});
      return;
    }
  }
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();postComment(panelId);}
}

async function tryAutoLogin(){
  var session=loadSession();
  if(!session||!session.u||!session.h)return;
  try{
    var user=await dbUser(session.u);
    if(!user||user.password_hash!==session.h)return;
    CU=session.u;
    var sv=await dbGetPicks(CU);
    SAVED=!!(sv&&sv.picks);
    picks=sv&&sv.picks?Object.assign(blank(),sv.picks):blank();
    launch();
  }catch(e){clearSession();}
}
